name: drawing-worlds

services:
  app:
    build:
      context: .
      args:
        # Build-time only: must be the public wss:// URL, e.g.
        # wss://draw.example.com/ws. next build inlines this value.
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL at build time, e.g. wss://draw.example.com/ws}"
    image: drawing-worlds:latest
    environment:
      NODE_ENV: production
      WS_PORT: "4100"
      # Required in production: browser origins allowed to open the WebSocket.
      WS_ALLOWED_ORIGINS: "${WS_ALLOWED_ORIGINS:?Set WS_ALLOWED_ORIGINS, e.g. https://draw.example.com}"
    ports:
      - "3000:3000"
    expose:
      # WebSocket port for a reverse proxy on the same Docker network.
      - "4100"
    volumes:
      # worlds.json snapshot is written to /app/.data (a symlink to /app/data).
      - ./data:/app/data
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -o /dev/null http://127.0.0.1:3000/ && curl -fsS -o /dev/null http://127.0.0.1:4100/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# Reverse proxy example (Caddy), run on the same Docker network or on the host:
#
# draw.example.com {
#     encode zstd gzip
#     handle /ws* {
#         reverse_proxy app:4100
#     }
#     reverse_proxy app:3000
# }
#
# Build with NEXT_PUBLIC_WS_URL=wss://draw.example.com/ws. If Caddy is on the
# host rather than the Compose network, publish 4100:4100 as well.
# Set WS_ALLOWED_ORIGINS=https://draw.example.com in .env.
# On Linux, make the bind mount writable by UID 1000 before the first start:
#   mkdir -p data && sudo chown -R 1000:1000 data
